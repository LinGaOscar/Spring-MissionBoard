services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wbsflow
      POSTGRES_USER: wbsflow
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wbsflow -d wbsflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

volumes:
  pgdata:
