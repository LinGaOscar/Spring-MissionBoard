spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/missionboard
    username: missionboard
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
  thymeleaf:
    cache: false
server:
  port: 8080
logging:
  level:
    com.missionboard: INFO
